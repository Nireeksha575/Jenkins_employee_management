services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: employees_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - employee-net

  app1:
    image: employee_management:latest
    container_name: app1
    ports:
      - "8081:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: employees_db
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - employee-net

  app2:
    image: employee_management:latest
    container_name: app2
    ports:
      - "8082:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: employees_db
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - employee-net

